
name: Build Wrecking Orbit Desktop

on:
  push:
    branches: [main]
    paths:
      - 'wo-app/**'
      - 'index.html'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: wo-app
        run: npm ci

      - name: Set version
        working-directory: wo-app
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version

      - name: Copy latest game
        run: Copy-Item index.html wo-app/index.html

      - name: Build and publish Windows installer
        working-directory: wo-app
        run: npm run build -- --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
